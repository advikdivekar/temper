# One command to run everything:  docker compose up --build
# Frontend: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: temper
      POSTGRES_PASSWORD: temper
      POSTGRES_DB: temper
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://temper:temper@database:5432/temper
      EVIDENCE_DIR: /storage/evidence
      KEY_DIR: /storage/keys
    volumes:
      - filedata:/storage
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dbdata:
  filedata:
