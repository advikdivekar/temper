[project]
name = "temper_backend"
version = "0.1.0"
description = "Temper API, ledger and evidence storage"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
